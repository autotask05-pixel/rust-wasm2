[package]
name = "game-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_sdks"
path = "src/bin/generate_sdks.rs"

[dependencies]
rapier2d = "0.35.2"
glam = { version = "0.29.3", default-features = false, features = ["libm"] }
ultraviolet = "0.10.0"
wide = "0.7"
bytemuck = { version = "1.22.0", features = ["derive"] }

ts-rs = "12.0.1"
typeshare = "1.0"
interoptopus = "0.14"
interoptopus_backend_csharp = "0.14"
interoptopus_backend_cpython = "0.14"
interoptopus_backend_c = "0.14"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
