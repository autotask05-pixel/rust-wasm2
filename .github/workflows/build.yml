name: Engine Pipeline & Multi-Platform Distribution

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  # =====================================================
  # 1. SDK GENERATION & PACKAGE MANIFESTS
  # =====================================================
  build-sdks:
    name: Generate Multi-Language SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Typeshare CLI
        run: cargo install typeshare-cli

      - name: Run Generator Binary
        run: cargo run --bin generate_sdks

      - name: Zip SDKs Bundle
        run: zip -r sdks.zip sdks/

      - name: Upload SDK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-sdks
          path: sdks.zip

      - name: Upload Unpacked SDKs (For Publishing)
        uses: actions/upload-artifact@v4
        with:
          name: sdk-sources
          path: sdks/

  # =====================================================
  # 2. AUTO-DOCS DEPLOYMENT (GitHub Pages)
  # =====================================================
  docs:
    name: Build & Publish Live Documentation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust HTML Documentation
        run: |
          cargo doc --no-deps --document-private-items
          echo '<meta http-equiv="refresh" content="0; url=game_wasm/index.html">' > target/doc/index.html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # =====================================================
  # 3. WASM (SIMD) BUILD & CLOUDFLARE WORKER DEPLOYMENT
  # =====================================================
  build-and-deploy-wasm:
    name: WASM Build & Cloudflare Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Latest Binaryen (wasm-opt)
        run: |
          VERSION="version_122"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${VERSION}/binaryen-${VERSION}-x86_64-linux.tar.gz" | sudo tar -xz --strip-components=1 -C /usr/local

      - name: Compile WASM with Relaxed SIMD
        run: |
          RUSTFLAGS="-C target-feature=+simd128,+relaxed-simd" cargo build --target wasm32-unknown-unknown --release

      - name: Optimize WASM with wasm-opt
        run: |
          wasm-opt --all-features -O3 target/wasm32-unknown-unknown/release/game_wasm.wasm -o game_wasm_opt.wasm

      - name: Upload WASM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edge-worker-wasm
          path: game_wasm_opt.wasm

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != '' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy

  # =====================================================
  # 4. CROSS-PLATFORM NATIVE ENGINES (.so, .dll)
  # =====================================================
  build-android:
    name: Android Native (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android ARM64 Library
        run: |
          cargo ndk -t arm64-v8a build --release
          cp target/aarch64-linux-android/release/libgame_wasm.so libgame_wasm_android_arm64.so

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-lib
          path: libgame_wasm_android_arm64.so

  build-desktop:
    name: Desktop (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64-lib
            output_file: target/x86_64-unknown-linux-gnu/release/libgame_wasm.so
            renamed_file: libgame_wasm_linux_x86_64.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64-dll
            output_file: target/x86_64-pc-windows-msvc/release/game_wasm.dll
            renamed_file: game_wasm_windows_x86_64.dll

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Native Binary
        run: cargo build --target ${{ matrix.target }} --release

      - name: Rename Artifact
        shell: bash
        run: cp ${{ matrix.output_file }} ${{ matrix.renamed_file }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.renamed_file }}

  # =====================================================
  # 5. PUBLISH PACKAGES TO REGISTRIES (npm & NuGet)
  # =====================================================
  publish-packages:
    name: Publish SDKs (npm & NuGet)
    needs: [build-sdks]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to Node 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Download SDK Sources
        uses: actions/download-artifact@v4
        with:
          name: sdk-sources
          path: sdks

      - name: Publish TypeScript SDK
        run: |
          cd sdks/ts
          sed -i 's|"@game-engine/sdk"|"@${{ github.repository_owner }}/game-engine-sdk"|g' package.json
          npm publish || echo "Package already exists"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack and Publish C# SDK
        run: |
          cd sdks/csharp
          dotnet pack -c Release -o out
          dotnet nuget push out/*.nupkg --api-key ${{ secrets.GITHUB_TOKEN }} --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --skip-duplicate

  # =====================================================
  # 6. OFFICIAL GITHUB RELEASE
  # =====================================================
  create-release:
    name: Publish Official Release
    needs: [build-sdks, build-and-deploy-wasm, build-android, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/sdks.zip
            release_assets/game_wasm_opt.wasm
            release_assets/libgame_wasm_android_arm64.so
            release_assets/libgame_wasm_linux_x86_64.so
            release_assets/game_wasm_windows_x86_64.dll
          generate_release_notes: true
          draft: false
          prerelease: false
