name: Multi-Platform Engine & SDK Build

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]

permissions:
  contents: write

jobs:
  # =====================================================
  # 1. AUTO SDK GENERATION
  # =====================================================
  generate-sdks:
    name: Generate Multi-Language SDKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Typeshare CLI
        run: cargo install typeshare-cli

      - name: Run SDK Generator Binary
        run: cargo run --bin generate_sdks

      - name: Zip SDKs
        run: zip -r sdks.zip sdks/

      - name: Upload Generated SDKs
        uses: actions/upload-artifact@v4
        with:
          name: game-multi-lang-sdks
          path: sdks.zip

  # =====================================================
  # 2. WASM WITH RELAXED SIMD (Cloudflare Edge)
  # =====================================================
  build-wasm:
    name: WebAssembly (Edge Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Latest Binaryen (wasm-opt)
        run: |
          VERSION="version_122"
          curl -sSL "https://github.com/WebAssembly/binaryen/releases/download/${VERSION}/binaryen-${VERSION}-x86_64-linux.tar.gz" | sudo tar -xz --strip-components=1 -C /usr/local

      - name: Compile WASM with SIMD
        run: |
          RUSTFLAGS="-C target-feature=+simd128,+relaxed-simd" cargo build --target wasm32-unknown-unknown --release

      - name: Optimize WASM Size with wasm-opt
        run: |
          wasm-opt --all-features -O3 target/wasm32-unknown-unknown/release/game_wasm.wasm -o game_wasm_opt.wasm

      - name: Upload WASM Binary
        uses: actions/upload-artifact@v4
        with:
          name: edge-worker-wasm
          path: game_wasm_opt.wasm

  # =====================================================
  # 3. ANDROID NATIVE (.so with NDK)
  # =====================================================
  build-android:
    name: Android Native (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android ARM64 Library
        run: |
          cargo ndk -t arm64-v8a build --release
          cp target/aarch64-linux-android/release/libgame_wasm.so libgame_wasm_android_arm64.so

      - name: Upload Android Shared Library
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-lib
          path: libgame_wasm_android_arm64.so

  # =====================================================
  # 4. PC / NATIVE PLATFORMS (Matrix)
  # =====================================================
  build-desktop:
    name: Desktop Native (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: linux-x86_64-lib
            output_file: target/x86_64-unknown-linux-gnu/release/libgame_wasm.so
            renamed_file: libgame_wasm_linux_x86_64.so
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: windows-x86_64-dll
            output_file: target/x86_64-pc-windows-msvc/release/game_wasm.dll
            renamed_file: game_wasm_windows_x86_64.dll

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile Native Shared Library
        run: cargo build --target ${{ matrix.target }} --release

      - name: Rename Artifact
        shell: bash
        run: cp ${{ matrix.output_file }} ${{ matrix.renamed_file }}

      - name: Upload Desktop Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.renamed_file }}

  # =====================================================
  # 5. AUTOMATED GITHUB RELEASE (Only runs on Tags)
  # =====================================================
  create-release:
    name: Publish Release Artifacts
    needs: [generate-sdks, build-wasm, build-android, build-desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Display release assets
        run: ls -lh release_assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/sdks.zip
            release_assets/game_wasm_opt.wasm
            release_assets/libgame_wasm_android_arm64.so
            release_assets/libgame_wasm_linux_x86_64.so
            release_assets/game_wasm_windows_x86_64.dll
          generate_release_notes: true
          draft: false
          prerelease: false

          
deploy-docs:
    name: Build & Publish Live Docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Rust HTML Docs
        run: cargo doc --no-deps --document-private-items

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Docs Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc/game_wasm/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
